<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${carrera.id} != null ? 'Editar Carrera' : 'Nueva Carrera'"></title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="container mx-auto p-6 max-w-2xl">
    <h1 class="text-3xl font-bold text-blue-600 mb-6" th:text="${carrera.id} != null ? 'Editar Carrera' : 'Nueva Carrera'"></h1>

    <form th:action="${carrera.id} != null ? @{'/admin/catalogo/carreras/' + ${carrera.id}} : @{/admin/catalogo/carreras}"
          method="post" class="bg-white rounded shadow p-6 flex flex-col gap-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Nombre</label>
            <input type="text" name="nombre" th:value="${carrera.nombre}"
                   class="w-full p-2 border rounded focus:ring-blue-500 focus:border-blue-500" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Facultad</label>
            <select name="facultad.id" class="w-full p-2 border rounded" required>
                <option value="" disabled th:selected="${carrera.facultad} == null">-- Seleccione --</option>
                <option th:each="fac : ${facultades}" th:value="${fac.id}" th:text="${fac.nombre}"
                        th:selected="${carrera.facultad != null and carrera.facultad.id == fac.id}">
                </option>
            </select>
        </div>

        <div class="flex items-center gap-2" th:if="${carrera.id} != null">
            <input type="checkbox" name="activo" th:field="*{carrera.activo}" class="h-4 w-4">
            <label class="text-sm text-gray-700">Activo</label>
        </div>

        <div class="flex gap-2 justify-end">
            <a th:href="@{/admin/catalogo/carreras}" class="px-4 py-2 rounded border">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
