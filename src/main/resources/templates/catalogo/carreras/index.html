<div th:replace="~{components/base :: layout(~{::content})}"
     xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
    <div th:fragment="content" class="container mx-auto p-6">
        <div class="mb-12 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Gestión de Carreras Universitarias</h1>
                <p class="mt-1 text-sm text-gray-600">Administración de las carreras universitarias</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/catalogo/carreras/nuevo}" class="inline-flex items-center rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">
                    <span class="material-icons-outlined mr-1">add</span>
                    Nueva Carrera
                </a>
            </div>
        </div>
        <div class="flex gap-2 mb-4 p-3 rounded-lg bg-green-100 text-green-800" th:if="${success}">
            <span class="material-icons-outlined mr-1">check_circle</span>
            <p th:text="${success}"></p>
        </div>
        <div class="bg-white rounded-lg shadow">
            <table class="w-full text-left text-sm text-gray-600">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                    <tr>
                        <th scope="col" class="px-6 py-3">Nombre</th>
                        <th scope="col" class="px-6 py-3">Facultad</th>
                        <th scope="col" class="px-6 py-3">Activo</th>
                        <th scope="col" class="px-6 py-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="car : ${carreras}" class="border-t hover:bg-gray-50">
                        <td class="px-6 py-1" th:text="${car.nombre}"></td>
                        <td class="px-6 py-1" th:text="${car.facultad.nombre}"></td>
                        <td class="px-6 py-1">
                            <span th:if="${car.activo}" class="inline-block px-4 py-1 text-xs rounded-full bg-green-100 text-green-700">Sí</span>
                            <span th:if="${!car.activo}" class="inline-block px-4 py-1 text-xs rounded-full bg-red-100 text-red-700">No</span>
                        </td>
                        <td class="px-6 py-1">
                            <div class="flex items-center justify-center justify-items-center gap-2">
                                <a th:href="@{'/admin/catalogo/carreras/' + ${car.id} + '/editar'}"
                                    class="inline-flex text-sm bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded-lg">
                                    <span class="material-icons-outlined mr-1">edit</span>
                                    Editar
                                </a>
                                <form th:action="@{'/admin/catalogo/carreras/' + ${car.id} + '/eliminar'}"
                                      method="post"
                                      onsubmit="return confirm('¿Eliminar carrera?');"
                                      class="m-0"> <!-- <- agregado -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="inline-flex text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-lg">
                                        <span class="material-icons-outlined mr-1">delete</span>
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(carreras)}">
                        <td class="p-3 border text-center text-gray-500" colspan="5">No hay carreras registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
