<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Empresas</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="container mx-auto p-6">
    <div th:if="${success}" class="mb-4 p-3 rounded bg-green-100 text-green-800" th:text="${success}"></div>
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold text-blue-600">Mantenimiento de Empresas</h1>
        <div class="flex gap-2">
            <a th:href="@{/}" class="text-sm text-blue-700 underline">Inicio</a>
            <a th:href="@{/admin/catalogo/empresas/nuevo}"
               class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Nueva Empresa</a>
        </div>
    </div>

    <div class="bg-white rounded shadow">
        <table class="w-full border-collapse">
            <thead>
            <tr class="bg-gray-200 text-left">
                <th class="p-3 border">ID</th>
                <th class="p-3 border">Nombre</th>
                <th class="p-3 border">Activo</th>
                <th class="p-3 border">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${empresas}" class="hover:bg-gray-50">
                <td class="p-3 border" th:text="${e.id}"></td>
                <td class="p-3 border" th:text="${e.nombre}"></td>
                <td class="p-3 border">
                    <span th:if="${e.activo}" class="inline-block px-2 py-1 text-xs rounded bg-green-100 text-green-700">Sí</span>
                    <span th:if="${!e.activo}" class="inline-block px-2 py-1 text-xs rounded bg-red-100 text-red-700">No</span>
                </td>
                <td class="p-3 border">
                    <div class="flex gap-2">
                        <a th:href="@{'/admin/catalogo/empresas/' + ${e.id} + '/editar'}"
                           class="text-sm bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded">Editar</a>
                        <form th:action="@{'/admin/catalogo/empresas/' + ${e.id} + '/eliminar'}" method="post" onsubmit="return confirm('¿Eliminar empresa?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empresas)}">
                <td class="p-3 border text-center text-gray-500" colspan="4">No hay empresas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
