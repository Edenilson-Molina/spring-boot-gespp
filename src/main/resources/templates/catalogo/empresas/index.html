<div th:replace="~{components/base :: layout(~{::content})}">
    <div th:fragment="content" class="container mx-auto p-6">
        <div class="mb-12 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Mantenimiento de Empresas</h1>
                <p class="mt-1 text-sm text-gray-600">Administración de empresas vinculadas</p>
            </div>
            <div class="flex items-center gap-2">
                <a th:href="@{/admin/catalogo/supervisores}"
                   class="inline-flex items-center rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                    <span class="material-icons-outlined mr-1">groups</span>
                    Supervisores
                </a>
                <a th:href="@{/admin/catalogo/empresas/nuevo}"
                   class="inline-flex items-center rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">
                    <span class="material-icons-outlined mr-1">add</span>
                    Nueva Empresa
                </a>
            </div>
        </div>

        <div class="flex gap-2 mb-4 p-3 rounded-lg bg-green-100 text-green-800" th:if="${success}">
            <span class="material-icons-outlined mr-1">check_circle</span>
            <p th:text="${success}"></p>
        </div>

        <div class="overflow-hidden rounded-lg border bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                        <tr>
                            <th class="px-6 py-3">ID</th>
                            <th class="px-6 py-3">Nombre</th>
                            <th class="px-6 py-3">Activo</th>
                            <th class="px-6 py-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${empresas}" class="border-t hover:bg-gray-50">
                            <td class="px-6 py-3" th:text="${e.id}"></td>
                            <td class="px-6 py-3" th:text="${e.nombre}"></td>
                            <td class="px-6 py-3">
                                <span th:if="${e.activo}" class="inline-block rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700">Sí</span>
                                <span th:if="${!e.activo}" class="inline-block rounded-full bg-red-100 px-3 py-1 text-xs font-medium text-red-700">No</span>
                            </td>
                            <td class="px-6 py-3">
                                <div class="flex items-center gap-2">
                                    <a th:href="@{'/admin/catalogo/empresas/' + ${e.id} + '/editar'}"
                                       class="inline-flex rounded-lg bg-yellow-500 px-3 py-1 text-sm font-medium text-white hover:bg-yellow-600">Editar</a>
                                    <form th:action="@{'/admin/catalogo/empresas/' + ${e.id} + '/eliminar'}" method="post" onsubmit="return confirm('¿Eliminar empresa?');" class="m-0">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="inline-flex rounded-lg bg-red-600 px-3 py-1 text-sm font-medium text-white hover:bg-red-700">Eliminar</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td class="px-6 py-3 text-center text-gray-500" colspan="4">No hay empresas registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
