<div th:replace="~{components/base :: layout(~{::content})}">
    <div th:fragment="content" class="container mx-auto p-6 max-w-2xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900" th:text="${oferta.id} != null ? 'Editar Oferta' : 'Nueva Oferta'"></h1>
            <p class="mt-1 text-sm text-gray-600">Los campos marcados con * son obligatorios</p>
        </div>

        <form th:object="${oferta}"
              th:action="${oferta.id} != null ? @{'/admin/catalogo/ofertas/' + ${oferta.id}} : @{/admin/catalogo/ofertas}"
              method="post" class="rounded-lg border bg-white p-6 shadow-sm flex flex-col gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Supervisor *</label>
                <select th:field="*{supervisor.id}" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-blue-500 focus:ring-blue-500" required>
                    <option value="" disabled th:selected="${oferta.supervisor} == null">-- Seleccione --</option>
                    <option th:each="s : ${supervisores}" th:value="${s.id}" th:text="${s.nombre + ' ' + s.apellido + ' — ' + s.empresa.nombre}"></option>
                </select>
                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('supervisor')}" th:errors="*{supervisor}"></p>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Nombre *</label>
                <input type="text" th:field="*{nombre}"
                       class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500" required>
                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Descripción</label>
                <textarea th:field="*{descripcion}" rows="3" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Opcional"></textarea>
                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Vacantes *</label>
                    <input type="number" min="0" th:field="*{vacantes}" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm" required>
                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('vacantes')}" th:errors="*{vacantes}"></p>
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Ocupados</label>
                    <input type="number" th:value="${oferta.ocupados}" class="block w-full rounded-lg border border-gray-200 bg-gray-100 p-2.5 text-sm" disabled>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" th:field="*{activo}" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <label class="text-sm text-gray-700">Activo</label>
            </div>

            <div class="flex gap-2 justify-end">
                <a th:href="@{/admin/catalogo/ofertas}" class="inline-flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</a>
                <button type="submit" class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
            </div>
        </form>
    </div>
</div>
