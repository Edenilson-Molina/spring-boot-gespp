<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${supervisor.id} != null ? 'Editar Supervisor' : 'Nuevo Supervisor'"></title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="container mx-auto p-6 max-w-2xl">
    <h1 class="text-3xl font-bold text-blue-600 mb-2" th:text="${supervisor.id} != null ? 'Editar Supervisor' : 'Nuevo Supervisor'"></h1>
    <p class="text-sm text-gray-500 mb-6">Los campos marcados con * son obligatorios</p>

    <form th:object="${supervisor}"
          th:action="${supervisor.id} != null ? @{'/admin/catalogo/supervisores/' + ${supervisor.id}} : @{/admin/catalogo/supervisores}"
          method="post" class="bg-white rounded shadow p-6 flex flex-col gap-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Nombre *</label>
                <input type="text" th:field="*{nombre}"
                       class="w-full p-2 border rounded focus:ring-blue-500 focus:border-blue-500" required>
                <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Apellido *</label>
                <input type="text" th:field="*{apellido}"
                       class="w-full p-2 border rounded focus:ring-blue-500 focus:border-blue-500" required>
                <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></p>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Empresa *</label>
            <select th:field="*{empresa.id}" class="w-full p-2 border rounded" required>
                <option value="" disabled th:selected="${supervisor.empresa} == null">-- Seleccione --</option>
                <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}"></option>
            </select>
            <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('empresa')}" th:errors="*{empresa}"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Descripción</label>
            <textarea th:field="*{descripcion}" rows="3" class="w-full p-2 border rounded focus:ring-blue-500 focus:border-blue-500" placeholder="Opcional"></textarea>
            <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" th:field="*{activo}" class="h-4 w-4">
            <label class="text-sm text-gray-700">Activo</label>
        </div>

        <div class="flex gap-2 justify-end">
            <a th:href="@{/admin/catalogo/supervisores}" class="px-4 py-2 rounded border">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
