<div th:replace="~{components/base :: layout(~{::content})}">
    <div th:fragment="content" class="container mx-auto p-6 max-w-2xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900" th:text="${supervisor.id} != null ? 'Editar Supervisor' : 'Nuevo Supervisor'"></h1>
            <p class="mt-1 text-sm text-gray-600">Los campos marcados con * son obligatorios</p>
        </div>

        <form th:object="${supervisor}"
              th:action="${supervisor.id} != null ? @{'/admin/catalogo/supervisores/' + ${supervisor.id}} : @{/admin/catalogo/supervisores}"
              method="post" class="rounded-lg border bg-white p-6 shadow-sm flex flex-col gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Nombre *</label>
                    <input type="text" th:field="*{nombre}"
                           class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500" required>
                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Apellido *</label>
                    <input type="text" th:field="*{apellido}"
                           class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500" required>
                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></p>
                </div>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Empresa *</label>
                <select th:field="*{empresa.id}" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-blue-500 focus:ring-blue-500" required>
                    <option value="" disabled th:selected="${supervisor.empresa} == null">-- Seleccione --</option>
                    <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}"></option>
                </select>
                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('empresa')}" th:errors="*{empresa}"></p>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Descripción</label>
                <textarea th:field="*{descripcion}" rows="3" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Opcional"></textarea>
                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" th:field="*{activo}" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <label class="text-sm text-gray-700">Activo</label>
            </div>

            <div class="flex gap-2 justify-end">
                <a th:href="@{/admin/catalogo/supervisores}" class="inline-flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</a>
                <button type="submit" class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
            </div>
        </form>
    </div>
</div>
