<!DOCTYPE html>
<html th:fragment="layout(content)" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'Sistema de control | GESPP'"></title>
    <!-- Tailwind (generado) -->
    <link th:href="@{/css/output.css}" rel="stylesheet" />
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-900">
    <!-- Navbar -->
    <div th:replace="~{components/navbar :: navbar}"></div>

    <!-- Contenido con sidebar -->
    <div class="flex flex-1 w-full max-w-screen-2xl mx-auto">
        <!-- Sidebar (oculta en pantallas pequeñas) -->
        <aside class="hidden lg:block w-64 shrink-0 border-r bg-white">
            <div th:replace="~{components/sidebar :: sidebar}"></div>
        </aside>

        <!-- Área principal -->
        <main id="content" class="flex-1 p-4 sm:p-6 lg:p-8">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Footer -->
    <div th:replace="~{components/footer :: footer}"></div>

    <!-- Flowbite.js -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
