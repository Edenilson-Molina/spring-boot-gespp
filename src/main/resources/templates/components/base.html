<!DOCTYPE html>
<html th:fragment="layout(content)" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'Sistema de control | GESPP'"></title>
    <!-- Tailwind (generado) -->
    <link th:href="@{/css/output.css}" rel="stylesheet" />

    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-900">
    <!-- Navbar -->
    <div th:replace="~{components/navbar :: navbar(${path})}"></div>

    <!-- Contenido con sidebar -->
    <div class="flex flex-1 w-full mx-auto">
        <!-- Sidebar (oculta en pantallas pequeñas) -->
        <aside class="hidden lg:block w-64 shrink-0 border-r bg-white">
            <div th:replace="~{components/sidebar :: sidebar(${path})}"></div>
        </aside>

        <!-- Área principal -->
        <main id="content" class="flex flex-col flex-1 p-4 sm:p-6 lg:p-8">
            <div class="flex-1" th:replace="${content}"></div>
            <!-- Footer -->
            <!--<div th:replace="~{components/footer :: footer}"></div> -->
        </main>
    </div>


    <!-- Flowbite.js -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
