<div th:replace="~{components/base :: layout(~{::content})}">
    <div th:fragment="content" class="container mx-auto p-6 max-w-3xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Editar Expediente</h1>
            <p class="mt-1 text-sm text-gray-600">Actualice los datos del expediente seleccionado</p>
        </div>

        <div class="rounded-lg border bg-white p-6 shadow-sm">
            <div th:if="${error}" class="mb-4 rounded-md border border-red-200 bg-red-50 p-3 text-red-700" th:text="${error}"></div>
            <form th:action="@{'/admin/expedientes/' + ${expediente.id} + '/editar'}" method="post" class="grid grid-cols-1 gap-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Estudiante</label>
                    <input type="text" class="block w-full rounded-lg border border-gray-200 bg-gray-100 p-2.5 text-sm" th:value="${expediente.estudiante.carnet + ' - ' + expediente.estudiante.user.name + ' ' + expediente.estudiante.user.apellidos}" disabled>
                </div>

                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Carrera</label>
                    <input type="text" class="block w-full rounded-lg border border-gray-200 bg-gray-100 p-2.5 text-sm" th:value="${expediente.carrera.nombre}" disabled>
                </div>

                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Oferta</label>
                    <select name="ofertaId" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm">
                        <option th:each="o : ${ofertas}" th:value="${o.id}" th:text="${o.nombre}" th:selected="${o.id == expediente.oferta.id}"></option>
                    </select>
                </div>

                <div>
                    <label class="mb-1 block text-sm font-medium text-gray-700">Estado</label>
                    <select name="estado" class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm">
                        <option th:each="s : ${estados}" th:value="${s}" th:text="${s}" th:selected="${s == expediente.estado}"></option>
                    </select>
                </div>

                <div class="flex justify-end">
                    <a th:href="@{/admin/expedientes}" class="mr-3 inline-flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</a>
                    <button type="submit" class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
