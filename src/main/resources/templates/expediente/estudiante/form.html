<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiante</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-2xl mx-auto py-10">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8">
        <h1 class="text-2xl font-bold text-blue-600 mb-6">Registro de Estudiante</h1>
        <form th:action="@{/expediente/estudiante/registro}" th:object="${registro}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="md:col-span-2">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Datos de Usuario</h2>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Nombres</label>
                <input th:field="*{nombres}" type="text" class="w-full p-2 border rounded" placeholder="Nombres">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Apellidos</label>
                <input th:field="*{apellidos}" type="text" class="w-full p-2 border rounded" placeholder="Apellidos">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></p>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm text-gray-600">Correo electrónico</label>
                <input th:field="*{email}" type="email" class="w-full p-2 border rounded" placeholder="correo@dominio.com">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Contraseña</label>
                <input th:field="*{password}" type="password" class="w-full p-2 border rounded" placeholder="Contraseña">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Confirmar contraseña</label>
                <input th:field="*{confirmPassword}" type="password" class="w-full p-2 border rounded" placeholder="Confirmar contraseña">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
            </div>

            <div class="md:col-span-2 mt-4">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Datos de Estudiante</h2>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Carnet</label>
                <input th:field="*{carnet}" type="text" class="w-full p-2 border rounded" placeholder="Carnet">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('carnet')}" th:errors="*{carnet}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Fecha de nacimiento</label>
                <input th:field="*{fechaNacimiento}" type="date" class="w-full p-2 border rounded">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></p>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm text-gray-600">DUI (requerido si es mayor de edad)</label>
                <input th:field="*{dui}" type="text" class="w-full p-2 border rounded" placeholder="#########" maxlength="9">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('dui')}" th:errors="*{dui}"></p>
            </div>

            <div class="md:col-span-2 flex justify-end mt-4">
                <a th:href="@{/login}" class="mr-3 text-gray-600 hover:underline">Volver a iniciar sesión</a>
                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Registrarse</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
