<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de Estudiante</title>
    <link th:href="@{/css/output.css}" rel="stylesheet" />
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 py-10">
        <!-- Header simple, sin layout -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Crear cuenta de estudiante</h1>
            <p class="mt-2 text-sm text-gray-600">Completa tus datos para registrarte y continuar.</p>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 sm:p-8">
            <form th:action="@{/registro/estudiante/registro}" th:object="${registro}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Alerta de errores generales: debe ir dentro del form para que #fields tenga contexto -->
                <div class="md:col-span-2" th:if="${#fields.hasAnyErrors()}">
                    <div class="mb-4 rounded-md border border-red-200 bg-red-50 p-4 text-sm text-red-700">
                        Revisa los campos resaltados y vuelve a intentarlo.
                    </div>
                </div>

                <div class="md:col-span-2">
                    <h2 class="text-base font-semibold text-gray-800">Datos de usuario</h2>
                </div>

          <div>
              <label th:for="*{nombres}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('nombres')} ? ' text-red-700'">Nombres</label>
              <input th:field="*{nombres}" type="text" autocomplete="given-name" autofocus
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('nombres')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('nombres')}"
                  aria-describedby="error-nombres"
                  placeholder="Nombres" />
              <p id="error-nombres" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></p>
          </div>

          <div>
              <label th:for="*{apellidos}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('apellidos')} ? ' text-red-700'">Apellidos</label>
              <input th:field="*{apellidos}" type="text" autocomplete="family-name"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('apellidos')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('apellidos')}"
                  aria-describedby="error-apellidos"
                  placeholder="Apellidos" />
              <p id="error-apellidos" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></p>
          </div>

          <div class="md:col-span-2">
              <label th:for="*{email}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('email')} ? ' text-red-700'">Correo electrónico</label>
              <input th:field="*{email}" type="email" autocomplete="email"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('email')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('email')}"
                  aria-describedby="error-email"
                  placeholder="correo@dominio.com" />
              <p id="error-email" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
          </div>

          <div>
              <label th:for="*{password}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('password')} ? ' text-red-700'">Contraseña</label>
              <input th:field="*{password}" type="password" autocomplete="new-password"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('password')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('password')}"
                  aria-describedby="error-password"
                  placeholder="Contraseña" />
              <p id="error-password" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
          </div>

          <div>
              <label th:for="*{confirmPassword}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('confirmPassword')} ? ' text-red-700'">Confirmar contraseña</label>
              <input th:field="*{confirmPassword}" type="password" autocomplete="new-password"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('confirmPassword')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}"
                  aria-describedby="error-confirmPassword"
                  placeholder="Confirmar contraseña" />
              <p id="error-confirmPassword" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
          </div>

                <div class="md:col-span-2 pt-2">
                    <h2 class="text-base font-semibold text-gray-800">Datos de estudiante</h2>
                </div>

          <div>
              <label th:for="*{carnet}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('carnet')} ? ' text-red-700'">Carnet</label>
              <input th:field="*{carnet}" type="text" inputmode="numeric"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('carnet')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('carnet')}"
                  aria-describedby="error-carnet"
                  placeholder="Carnet" />
              <p id="error-carnet" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('carnet')}" th:errors="*{carnet}"></p>
          </div>

          <div>
              <label th:for="*{fechaNacimiento}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('fechaNacimiento')} ? ' text-red-700'">Fecha de nacimiento</label>
              <input th:field="*{fechaNacimiento}" type="date"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('fechaNacimiento')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('fechaNacimiento')}"
                  aria-describedby="error-fechaNacimiento" />
              <p id="error-fechaNacimiento" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></p>
          </div>

          <div class="md:col-span-2">
              <label th:for="*{dui}" class="block text-sm font-medium text-gray-700"
                  th:classappend="${#fields.hasErrors('dui')} ? ' text-red-700'">DUI <span class="text-gray-500 font-normal">(requerido si es mayor de edad)</span></label>
              <input th:field="*{dui}" type="text" maxlength="9" inputmode="numeric"
                  class="mt-1 px-2 py-1 block w-full rounded-lg border border-gray-300 bg-white placeholder:text-gray-400 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  th:classappend="${#fields.hasErrors('dui')} ? ' border-red-500 ring-1 ring-red-200 focus:border-red-500 focus:ring-red-500'"
                  th:attr="aria-invalid=${#fields.hasErrors('dui')}"
                  aria-describedby="error-dui"
                  placeholder="#########" />
              <p id="error-dui" class="mt-1 text-red-600 text-sm" th:if="${#fields.hasErrors('dui')}" th:errors="*{dui}"></p>
          </div>

                <div class="md:col-span-2 mt-2 flex items-center justify-between">
                    <a th:href="@{/login}" class="text-sm font-medium text-gray-600 hover:text-gray-900 hover:underline">Volver a iniciar sesión</a>
                    <button type="submit"
                            class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Registrarse
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
