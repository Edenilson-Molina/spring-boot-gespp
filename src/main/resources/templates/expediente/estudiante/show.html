<div th:replace="~{components/base :: layout(~{::content})}">
    <div th:fragment="content" class="container mx-auto p-6 max-w-4xl">
        <div class="mb-4">
            <a th:href="@{/expediente/mis}" class="text-blue-600 hover:underline">← Volver a mis expedientes</a>
        </div>

        <div class="rounded-lg border bg-white p-8 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Expediente</h1>
                <span class="text-xs px-2 py-1 rounded-full"
                      th:classappend="${expediente.estado=='Registrado'?'bg-blue-100 text-blue-700':
                                       expediente.estado=='En curso'?'bg-green-100 text-green-700':
                                       expediente.estado=='Suspendido'?'bg-yellow-100 text-yellow-800':
                                       expediente.estado=='Finalizado'?'bg-gray-200 text-gray-700':'bg-red-100 text-red-700'}"
                      th:text="${expediente.estado}"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <div class="text-sm text-gray-500">Carnet</div>
                    <div class="font-medium" th:text="${expediente.estudiante.carnet}"></div>
                </div>
                <div>
                    <div class="text-sm text-gray-500">Estudiante</div>
                    <div class="font-medium" th:text="${expediente.estudiante.user.name + ' ' + expediente.estudiante.user.apellidos}"></div>
                </div>
                <div>
                    <div class="text-sm text-gray-500">Carrera</div>
                    <div class="font-medium" th:text="${expediente.carrera.nombre}"></div>
                </div>
                <div>
                    <div class="text-sm text-gray-500">Oferta</div>
                    <div class="font-medium" th:text="${expediente.oferta.nombre}"></div>
                </div>
                <div>
                    <div class="text-sm text-gray-500">Fecha inicio</div>
                    <div class="font-medium" th:text="${expediente.fechaInicio}"></div>
                </div>
                <div>
                    <div class="text-sm text-gray-500">Fecha fin</div>
                    <div class="font-medium" th:text="${expediente.fechaFin}"></div>
                </div>
            </div>
        </div>

        <!-- Informes mensuales -->
        <div class="mt-6 rounded-lg border bg-white p-8 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-900">Informes mensuales</h2>
            </div>

            <div th:if="${error}" class="mb-4 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-700" th:text="${error}"></div>
            <div th:if="${success}" class="mb-4 rounded border border-green-200 bg-green-50 p-3 text-sm text-green-700" th:text="${success}"></div>

            <div class="space-y-4">
                <div th:each="m : ${meses}">
                    <div class="flex items-center justify-between rounded-lg border p-4">
                        <div>
                            <div class="text-sm text-gray-500">Mes</div>
                            <div class="font-medium" th:text="${m}"></div>
                        </div>
                        <div class="flex-1 px-6">
                            <div th:if="${informes[m.toString()] != null}">
                                <div class="text-sm text-gray-500">Estado</div>
                                <div class="inline-flex items-center gap-3">
                                    <span class="text-sm px-2 py-1 rounded-full" th:classappend="${informes[m.toString()].estado.name()=='PENDIENTE_VERIFICACION'?'bg-yellow-100 text-yellow-800':(informes[m.toString()].estado.name()=='APROBADO'?'bg-green-100 text-green-700':(informes[m.toString()].estado.name()=='RECHAZADO'?'bg-red-100 text-red-700':'bg-orange-100 text-orange-700'))}" th:text="${informes[m.toString()].estado}"></span>
                                    <a class="text-blue-600 hover:underline" th:href="${informes[m.toString()].archivoPath}" target="_blank">Ver PDF</a>
                                </div>
                                <div class="text-xs text-gray-500 mt-1" th:if="${informes[m.toString()].comentario}">
                                    <span class="font-medium">Comentario admin:</span>
                                    <span th:text="${informes[m.toString()].comentario}"></span>
                                </div>
                            </div>
                            <div th:if="${informes[m.toString()] == null || informes[m.toString()].estado.name()=='RECHAZADO' || informes[m.toString()].estado.name()=='OBSERVADO'}">
                                <form th:action="@{'/expediente/' + ${expediente.id} + '/informes/' + ${m} + '/upload'}" method="post" enctype="multipart/form-data" class="flex items-center gap-3">
                                    <input type="file" name="file" accept="application/pdf" class="block w-full text-sm text-gray-900 file:mr-4 file:rounded-md file:border-0 file:bg-gray-100 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-gray-700 hover:file:bg-gray-200" required>
                                    <button type="submit" class="inline-flex rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">Subir PDF</button>
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                </form>
                                <p class="text-xs text-gray-500 mt-1">Solo archivos PDF. Si el informe fue observado o rechazado, puedes volver a subirlo.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
