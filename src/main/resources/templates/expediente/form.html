<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Expediente</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-3xl mx-auto py-10">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8">
        <h1 class="text-2xl font-bold text-blue-600 mb-6">Nuevo Expediente</h1>
        <form th:action="@{/expediente}" th:object="${expediente}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label class="block text-sm text-gray-600">Carrera</label>
                <select th:field="*{carreraId}" class="w-full p-2 border rounded">
                    <option value="" disabled selected>Seleccione...</option>
                    <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('carreraId')}" th:errors="*{carreraId}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Oferta</label>
                <select th:field="*{ofertaId}" class="w-full p-2 border rounded">
                    <option value="" disabled selected>Seleccione...</option>
                    <option th:each="o : ${ofertas}" th:value="${o.id}" th:text="${o.nombre}"></option>
                </select>
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('ofertaId')}" th:errors="*{ofertaId}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Fecha Inicio</label>
                <input th:field="*{fechaInicio}" type="date" class="w-full p-2 border rounded">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></p>
            </div>

            <div>
                <label class="block text-sm text-gray-600">Fecha Fin</label>
                <input th:field="*{fechaFin}" type="date" class="w-full p-2 border rounded">
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></p>
            </div>

            <div class="md:col-span-2 flex justify-end mt-4">
                <a th:href="@{/}" class="mr-3 text-gray-600 hover:underline">Cancelar</a>
                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Crear expediente</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
