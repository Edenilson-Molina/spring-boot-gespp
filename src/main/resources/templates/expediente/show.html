<div th:replace="~{components/base :: layout(~{::content})}">
    <div th:fragment="content" class="container mx-auto p-6 max-w-3xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Detalle de Expediente</h1>
            <p class="mt-1 text-sm text-gray-600">Información del expediente seleccionado</p>
        </div>

        <div class="rounded-lg border bg-white p-6 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-700">
                <div>
                    <span class="font-semibold">Carnet:</span>
                    <span th:text="${expediente.estudiante.carnet}"></span>
                </div>
                <div>
                    <span class="font-semibold">Estudiante:</span>
                    <span th:text="${expediente.estudiante.user.name + ' ' + expediente.estudiante.user.apellidos}"></span>
                </div>
                <div>
                    <span class="font-semibold">Carrera:</span>
                    <span th:text="${expediente.carrera.nombre}"></span>
                </div>
                <div>
                    <span class="font-semibold">Oferta:</span>
                    <span th:text="${expediente.oferta.nombre}"></span>
                </div>
                <div>
                    <span class="font-semibold">Fecha inicio:</span>
                    <span th:text="${expediente.fechaInicio}"></span>
                </div>
                <div>
                    <span class="font-semibold">Fecha fin:</span>
                    <span th:text="${expediente.fechaFin}"></span>
                </div>
                <div class="md:col-span-2">
                    <span class="font-semibold">Estado:</span>
                    <span th:text="${expediente.estado}"></span>
                </div>
            </div>
            <div class="mt-6">
                <a th:href="@{/}" class="inline-flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Volver al inicio</a>
            </div>
        </div>
    </div>
</div>
