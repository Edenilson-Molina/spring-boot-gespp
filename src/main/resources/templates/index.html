<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Spring MVC Template</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold text-blue-600 mb-4">Lista de Usuarios</h1>

    <!-- DEBUG: Muestra si está autenticado y sus roles -->
    <div sec:authorize="isAuthenticated()">
        <p class="bg-yellow-100 p-2 rounded">
            Autenticado como: <strong sec:authentication="name"></strong><br>
            Roles: <span sec:authentication="principal.authorities"></span>
        </p>
    </div>

    <!-- Botón solo para ESTUDIANTE -->
    <div sec:authorize="hasRole('ROLE_ESTUDIANTE')">
        <button class="bg-red-500 text-white p-2 rounded">Estudiante Only</button>
    </div>

    <!-- Botón solo para ADMIN -->
    <div sec:authorize="hasRole('ROLE_ADMIN')">
        <button class="bg-green-500 text-white p-2 rounded">Admin Only</button>
    </div>

    <!-- Mostrar solo si NO está autenticado -->
    <div sec:authorize="!isAuthenticated()">
        <p><a th:href="@{/login}" class="text-blue-600 underline">Iniciar sesión</a></p>
    </div>

    <!-- Mostrar solo si SÍ está autenticado -->
    <div sec:authorize="isAuthenticated()">
        <p>
            Bienvenido, <span sec:authentication="name"></span>!
            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="text-blue-600 underline ml-2">Cerrar sesión</button>
            </form>
        </p>
    </div>

    <!-- Formulario -->
    <form th:action="@{/user}" method="post" class="mb-6">
        <div class="flex flex-col gap-4 max-w-md">
            <input type="text" name="name" placeholder="Nombre" class="p-2 border rounded">
            <input type="email" name="email" placeholder="Email" class="p-2 border rounded">
            <button type="submit" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
                Agregar
            </button>
        </div>
    </form>

    <!-- Tabla -->
    <table class="w-full border-collapse border">
        <thead>
        <tr class="bg-gray-200">
            <th class="border p-2">ID</th>
            <th class="border p-2">Nombre</th>
            <th class="border p-2">Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td class="border p-2" th:text="${user.id}"></td>
            <td class="border p-2" th:text="${user.name}"></td>
            <td class="border p-2" th:text="${user.email}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Enlaces de Catálogo -->
    <div class="mt-6">
        <h2 class="text-xl font-semibold mb-2">Catálogos</h2>
        <ul class="list-disc list-inside">
            <li><a th:href="@{/admin/catalogo/carreras}" class="text-blue-600 underline">Mantenimiento de Carreras</a></li>
            <li><a th:href="@{/admin/catalogo/empresas}" class="text-blue-600 underline">Mantenimiento de Empresas</a></li>
            <li><a th:href="@{/admin/catalogo/supervisores}" class="text-blue-600 underline">Mantenimiento de Supervisores</a></li>
        </ul>
    </div>
</div>
</body>
</html>
