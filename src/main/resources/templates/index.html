<!-- Usa la plantilla base con slot de contenido -->
<div th:replace="~{components/base :: layout(~{::content})}"
     xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <div th:fragment="content" class="flex flex-1">
        <div class="flex flex-col flex-1 mx-auto max-w-screen-2xl">
            <div class="mb-6 flex items-center justify-end">
                <div class="flex items-center gap-3">
                    <a sec:authorize="hasRole('ROLE_ESTUDIANTE')" th:href="@{/expediente/nuevo}"
                       class="inline-flex items-center rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">
                       <span class="material-icons-outlined mr-1">add</span>
                       Crear expediente
                    </a>
                    <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/expedientes}"
                       class="inline-flex items-center rounded-lg bg-emerald-600 px-3 py-2 text-sm font-medium text-white hover:bg-emerald-700">
                       <span class="material-icons-outlined mr-1">visibility</span>
                       Ver expedientes
                    </a>
                    <a sec:authorize="hasRole('ROLE_ESTUDIANTE')" th:href="@{/expediente/mis}" 
                       class="inline-flex items-center rounded-lg bg-emerald-600 px-3 py-2 text-sm font-medium text-white hover:bg-emerald-700">
                       <span class="material-icons-outlined mr-1">assignment</span>
                       Mis expedientes
                    </a>
                </div>
            </div>

            <div class="flex flex-col flex-1 justify-center items-center">
                <h1 class="text-xl sm:text-2xl md:text-3xl xl:4xl font-bold text-center">Sistema para la gestión de prácticas profesionales</h1>
                <img th:src="@{/img/svg/Calculator-bro.svg}" alt="Imagen ilustrativa" class="mx-auto size-96 md:size-[30rem]" />
            </div>
        </div>
    </div>
</div>
